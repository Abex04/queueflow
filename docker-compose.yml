version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: queueflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: queueflow
      POSTGRES_USER: queueflow
      POSTGRES_PASSWORD: queueflow
    ports:
      - "5432:5432"
    volumes:
      - queueflow-pgdata:/var/lib/postgresql/data

volumes:
  queueflow-pgdata:
